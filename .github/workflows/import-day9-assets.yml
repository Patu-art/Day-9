name: Import supplied Day 9 brand media
on:
  push:
    paths:
      - '.github/workflows/import-day9-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-assets:
    if: github.repository == 'Patu-art/Day-9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download user-supplied originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/brand
          curl -fLsS --retry 4 --connect-timeout 20 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/701c6681-0181-45f1-9892-79d2c8b28de5.png' -o assets/brand/hero-bowl.png
          curl -fLsS --retry 4 --connect-timeout 20 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/2b285d41-c20d-4d1b-a4f0-10f0f42f8016.png' -o assets/brand/product-bowls.png
          curl -fLsS --retry 4 --connect-timeout 20 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/b6661070-9185-490e-b429-e9da666bc303.png' -o assets/brand/popup.png
          curl -fLsS --retry 4 --connect-timeout 20 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/994bcc24-447d-485e-997b-d71dec9b66ed.png' -o assets/brand/community.png
          curl -fLsS --retry 4 --connect-timeout 20 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/c24295a0-eca5-4a9b-beba-643ceda2c9d4.png' -o assets/brand/official-logo.png
          curl -fLsS --retry 4 --connect-timeout 20 'https://d2ol7oe51mr4n9.cloudfront.net/user_3J3dJDO4kVRMf5UPwJeCA5xocmE/99e016d1-a25e-4f5b-b6e0-b5dc9bda7203.mp4' -o assets/brand/preparation.mp4
          cat > /tmp/day9-assets.sha256 <<'EOF'
          1249564c95fd48bf1763f4a46ea782a4b96b8f3fee84deebff6be613d5cfdb16  assets/brand/hero-bowl.png
          7c272eca8478a769fe00470f0a20e8e75dc5d579ee273622e051e9b32f2f1177  assets/brand/product-bowls.png
          8f8c305dcce716a3a65ba73beeb4b4ee7f30664901e8ff812d18b74957bf64d0  assets/brand/popup.png
          9e9a004cbe74203c01dc60ec5ccb5896ee0aa07a77be3a4d6b32e0e55738a83a  assets/brand/community.png
          6ab3d370203bbd1e85949c7ddc745cfd08f61756168743ac4e6d6df503a1234d  assets/brand/official-logo.png
          06d8917ad7ee972dbb56fa47b6ba2ff1934d3693bc90d69ace13dd1e6b4d05e7  assets/brand/preparation.mp4
          EOF
          sha256sum --check /tmp/day9-assets.sha256
      - name: Commit media into repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand
          if ! git diff --staged --quiet; then
            git commit -m 'Add original Açaí Social Club photos, logo and preparation video'
            git push
          fi
